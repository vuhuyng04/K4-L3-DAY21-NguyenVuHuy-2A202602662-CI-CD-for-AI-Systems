name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

# Model moi duoc upload vao artifacts/candidate/ va chi duoc "promote" sang
# artifacts/current/ (noi VM tai model) sau khi qua Quality Gate. Nhu vay mot
# model khong dat nguong khong bao gio de len model dang phuc vu.
env:
  CANDIDATE_PREFIX: artifacts/candidate
  CURRENT_PREFIX: artifacts/current

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc S3, pull du lieu bang DVC, kiem tra lech lac du lieu, huan luyen,
  # upload model + report len S3 (artifacts/candidate/).
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    env:
      ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
      # Bonus 1: neu co secret MLFLOW_TRACKING_URI (DagsHub) thi log len do,
      # neu khong train.py tu dung sqlite:///mlflow.db.
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        # STORAGE_CREDENTIALS = {"aws_access_key_id":"...","aws_secret_access_key":"...","region":"ap-southeast-1"}
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PYEOF'
          import json, os
          creds = json.loads(os.environ["STORAGE_CREDENTIALS"])
          key_id = creds["aws_access_key_id"]
          secret = creds["aws_secret_access_key"]
          region = creds.get("region", "ap-southeast-1")
          print(f"::add-mask::{key_id}")
          print(f"::add-mask::{secret}")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"AWS_ACCESS_KEY_ID={key_id}\n")
              f.write(f"AWS_SECRET_ACCESS_KEY={secret}\n")
              f.write(f"AWS_DEFAULT_REGION={region}\n")
          PYEOF

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        # train.py in canh bao DATA DRIFT (Bonus 5), ghi detail.txt (Bonus 3)
        # va quet nguong quyet dinh (Bonus 2).
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; print(json.load(open('outputs/report.json'))['f1_score'])")
          echo "f1_score = $F1"
          echo "f1=$F1" >> "$GITHUB_OUTPUT"

      - name: Precision / recall report
        # Bonus 3: in confusion matrix + precision/recall tung lop vao log va Job Summary
        run: |
          cat outputs/detail.txt
          {
            echo '### Precision / Recall (holdout)'
            echo '```'
            cat outputs/detail.txt
            echo '```'
            echo '### report.json'
            echo '```json'
            cat outputs/report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate model to S3
        run: |
          python - <<'PYEOF'
          import boto3, os
          s3 = boto3.client("s3")
          bucket = os.environ["ARTIFACT_BUCKET"]
          prefix = os.environ["CANDIDATE_PREFIX"]
          for local, name in [("models/model.joblib", "model.joblib"), ("outputs/report.json", "report.json")]:
              s3.upload_file(local, bucket, f"{prefix}/{name}")
              print(f"Uploaded {local} -> s3://{bucket}/{prefix}/{name}")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # (a) f1_score >= 0.65 (KHONG dung accuracy: du lieu 75/25, doan bua da dat 0.75)
  # (b) Bonus 4: f1 moi phai >= f1 cua model dang phuc vu, neu khong huy trien khai.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        env:
          F1: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PYEOF'
          import os
          f1 = float(os.environ["F1"])
          threshold = 0.65
          if f1 < threshold:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < {threshold}. Huy trien khai.")
          print(f"PASSED: f1_score {f1:.4f} >= {threshold}.")
          PYEOF

      - name: Compare with production model (rollback guard)
        env:
          F1: ${{ needs.train.outputs.f1 }}
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          pip install --quiet boto3==1.34.84
          python - <<'PYEOF'
          import json, os
          import boto3
          from botocore.exceptions import ClientError

          creds = json.loads(os.environ["STORAGE_CREDENTIALS"])
          s3 = boto3.client(
              "s3",
              aws_access_key_id=creds["aws_access_key_id"],
              aws_secret_access_key=creds["aws_secret_access_key"],
              region_name=creds.get("region", "ap-southeast-1"),
          )
          new_f1 = float(os.environ["F1"])
          key = "artifacts/current/report.json"
          try:
              body = s3.get_object(Bucket=os.environ["ARTIFACT_BUCKET"], Key=key)["Body"].read()
          except ClientError as e:
              if e.response["Error"]["Code"] in ("NoSuchKey", "404"):
                  print(f"Chua co model dang phuc vu ({key}) -> cho phep trien khai lan dau. f1 moi = {new_f1:.4f}")
                  raise SystemExit(0)
              raise
          old_f1 = float(json.loads(body)["f1_score"])
          print(f"So sanh: f1 moi = {new_f1:.4f} | f1 dang phuc vu = {old_f1:.4f} | chenh lech = {new_f1 - old_f1:+.4f}")
          if new_f1 < old_f1:
              raise SystemExit("ROLLBACK GUARD: model moi kem hon model dang phuc vu -> giu nguyen phien ban cu, huy trien khai.")
          print("OK: model moi >= model dang phuc vu -> tiep tuc trien khai.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Promote candidate -> current tren S3, restart service tren VM, health check.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: Promote candidate model to current
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          pip install --quiet boto3==1.34.84
          python - <<'PYEOF'
          import json, os
          import boto3

          creds = json.loads(os.environ["STORAGE_CREDENTIALS"])
          s3 = boto3.client(
              "s3",
              aws_access_key_id=creds["aws_access_key_id"],
              aws_secret_access_key=creds["aws_secret_access_key"],
              region_name=creds.get("region", "ap-southeast-1"),
          )
          bucket = os.environ["ARTIFACT_BUCKET"]
          src, dst = os.environ["CANDIDATE_PREFIX"], os.environ["CURRENT_PREFIX"]
          for name in ("model.joblib", "report.json"):
              s3.copy_object(Bucket=bucket, CopySource={"Bucket": bucket, "Key": f"{src}/{name}"}, Key=f"{dst}/{name}")
              print(f"Promoted s3://{bucket}/{src}/{name} -> {dst}/{name}")
          PYEOF

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            for i in $(seq 1 12); do
              sleep 5
              if curl -sf http://localhost:8080/healthz; then
                echo
                echo "Health check passed (lan thu $i)."
                exit 0
              fi
            done
            echo "Health check FAILED sau 60 giay."
            sudo journalctl -u income-api -n 30 --no-pager
            exit 1
